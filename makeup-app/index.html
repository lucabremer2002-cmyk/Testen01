<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Look Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Startseite = Raster aus „Farbpaletten“-Karten; Detail = Kopf mit Swatches, darunter drei Tabs (Produkte / Anleitung / Videos). */
:root {
  --bg: #fbf4f2;
  --surface: #ffffff;
  --ink: #2a1a20;
  --muted: #7a6168;
  --line: #ecdcd9;
  --accent: #96294f;
  --accent-ink: #ffffff;
  --accent-soft: #f6e1e7;
  --ok: #2f7a55;
  --ok-soft: #e1f1e8;
  --warn: #9a6a12;
  --warn-soft: #f8edd6;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19121a; --surface: #241a24; --ink: #f6e9ee; --muted: #b59ca8; --line: #3a2b38;
    --accent: #ec7aa3; --accent-ink: #2a0f1b; --accent-soft: #3d2030;
    --ok: #7fd3a6; --ok-soft: #1d3329; --warn: #e8c070; --warn-soft: #3a2f18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #19121a; --surface: #241a24; --ink: #f6e9ee; --muted: #b59ca8; --line: #3a2b38;
  --accent: #ec7aa3; --accent-ink: #2a0f1b; --accent-soft: #3d2030;
  --ok: #7fd3a6; --ok-soft: #1d3329; --warn: #e8c070; --warn-soft: #3a2f18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
}
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; line-height: 1.1; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopfbereich */
.masthead { display: flex; flex-direction: column; gap: 6px; padding-block: 12px 20px; }
.masthead h1 { font-size: clamp(2.6rem, 9vw, 4.6rem); letter-spacing: -0.02em; }
.masthead h1 em { color: var(--accent); }
.masthead p { margin: 0; color: var(--muted); max-width: 52ch; }

.toolbar { display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; }
.search { width: 100%; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Raster */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px; margin-top: 8px; }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; text-align: left; padding: 0; transition: transform .15s ease; }
.card:hover { transform: translateY(-2px); }
.swatches { display: flex; height: 92px; }
.swatches span { flex: 1; }
.card-body { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 16px; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.card h3 { font-size: 1.35rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pill { font-size: 0.76rem; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.fav-dot { color: var(--accent); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* Detail */
.back { border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--muted); font-weight: 500; }
.hero { display: grid; gap: 16px; padding-block: 8px 20px; }
.hero h2 { font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: -0.015em; }
.hero .who { font-family: var(--display); font-style: italic; font-size: 1.3rem; color: var(--accent); }
.hero p { margin: 0; max-width: 60ch; }
.hero .swatches { height: 56px; border-radius: 10px; overflow: hidden; max-width: 420px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }

.summary { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-radius: var(--radius); background: var(--accent-soft); margin-bottom: 14px; }
.summary strong { font-variant-numeric: tabular-nums; }
.plist { display: flex; flex-direction: column; gap: 10px; list-style: none; padding: 0; margin: 0; }
.prod { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.prod.have { opacity: 0.6; }
.prod input { width: 22px; height: 22px; accent-color: var(--accent); margin-top: 2px; }
.prod-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.prod-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.prod-name { font-weight: 600; }
.brand { color: var(--muted); font-size: 0.9rem; }
.shade { font-family: var(--mono); font-size: 0.78rem; background: var(--bg); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
.price { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 0.85rem; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.links a { font-size: 0.82rem; font-weight: 600; text-decoration: none; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--bg); }
.links a:hover { border-color: var(--accent); color: var(--accent); }
.src { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.src.eigene { background: var(--ok-soft); color: var(--ok); }
.src.berichtet, .src.gesicht { background: var(--accent-soft); color: var(--accent); }
.src.match { background: var(--warn-soft); color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.82rem; color: var(--muted); margin-top: 16px; align-items: center; }

/* Anleitung */
.stepper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.step-count { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.stepper h3 { font-size: 1.8rem; }
.stepper p { margin: 0; font-size: 1.05rem; max-width: 60ch; }
.uses { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: var(--bg); border-radius: 10px; }
.uses .eyebrow { margin-bottom: 2px; }
.use-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.use-row a { font-size: 0.82rem; font-weight: 600; }
.step-nav { display: flex; justify-content: space-between; gap: 8px; }
.done { text-align: center; padding: 10px 0; }
.alllist { margin-top: 18px; padding-left: 1.3em; color: var(--muted); }
.alllist li { margin-bottom: 6px; }
.alllist li.current { color: var(--ink); font-weight: 600; }
.alllist button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; }

/* Videos */
.vlist { display: grid; gap: 10px; }
.video { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.video .play { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 0.9rem; }
.video small { display: block; color: var(--muted); }
.disclaimer { font-size: 0.82rem; color: var(--muted); margin-top: 28px; max-width: 70ch; }

@media (min-width: 760px) {
  .hero { grid-template-columns: 1.3fr 1fr; align-items: end; }
  .hero .swatches { height: 120px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  const LOOKS = window.LOOKS || [];
  const app = document.getElementById("app");

  // ---- Speicher (nur Komfort: Favoriten + „hab ich schon“) ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let favs = store.get("lb-favs", []);
  let owned = store.get("lb-owned", {}); // "Marke|Produkt" -> true

  const state = { filter: "alle", query: "", look: null, tab: "produkte", step: 0 };

  const FILTERS = [
    ["alle", "Alle"], ["favs", "♥ Favoriten"], ["celebrity", "Stars"], ["influencer", "Influencer"],
    ["alltag", "Alltag"], ["abend", "Abend"], ["party", "Party"], ["leicht", "Für Anfänger"], ["schnell", "Unter 15 Min."]
  ];
  const SRC = {
    eigene: "Eigene Marke",
    berichtet: "Von ihr / ihrem Artist genannt",
    gesicht: "Werbegesicht",
    match: "Ähnlicher Effekt"
  };
  const LEVEL = { leicht: "Anfänger", mittel: "Mittel", fortgeschritten: "Fortgeschritten" };

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const enc = encodeURIComponent;
  const pkey = p => p.brand + "|" + p.name;
  const fullName = p => p.brand + " " + p.name + (p.shade ? " " + p.shade : "");

  function shopLinks(p) {
    const q = enc(p.brand + " " + p.name);
    return [
      ["Douglas", "https://www.douglas.de/de/search?q=" + q],
      ["Amazon", "https://www.amazon.de/s?k=" + enc(fullName(p))],
      ["Google Shopping", "https://www.google.com/search?tbm=shop&q=" + enc(fullName(p))]
    ];
  }
  const yt = q => "https://www.youtube.com/results?search_query=" + enc(q);
  const tt = q => "https://www.tiktok.com/search?q=" + enc(q);

  const swatches = colors => '<div class="swatches" aria-hidden="true">' + colors.map(c => '<span style="background:' + c + '"></span>').join("") + "</div>";

  function matches(l) {
    const f = state.filter;
    if (f === "favs" && !favs.includes(l.id)) return false;
    if ((f === "celebrity" || f === "influencer") && l.kind !== f) return false;
    if ((f === "alltag" || f === "abend" || f === "party") && l.occasion !== f) return false;
    if (f === "leicht" && l.level !== "leicht") return false;
    if (f === "schnell" && l.minutes >= 15) return false;
    if (state.query) {
      const hay = (l.title + " " + l.person + " " + l.products.map(fullName).join(" ")).toLowerCase();
      if (!hay.includes(state.query.toLowerCase())) return false;
    }
    return true;
  }

  // ---- Startseite ----
  function renderHome() {
    const list = LOOKS.filter(matches);
    app.innerHTML =
      '<header class="masthead"><span class="eyebrow">Celebrity- &amp; Influencer-Looks zum Nachschminken</span>' +
      "<h1>Look <em>Book</em></h1>" +
      "<p>Look antippen, Produkte abhaken, Schritt für Schritt nachschminken. Zu jedem Produkt gibt es Shop-Links, zu jedem Look Video-Tutorials.</p></header>" +
      '<div class="toolbar"><input id="q" class="search" type="search" placeholder="Suche nach Star, Look oder Produkt …" aria-label="Suche" value="' + esc(state.query) + '">' +
      '<div class="chips" role="group" aria-label="Filter">' +
      FILTERS.map(([k, t]) => '<button class="chip" data-f="' + k + '" aria-pressed="' + (state.filter === k) + '">' + t + "</button>").join("") +
      "</div></div>" +
      (list.length
        ? '<div class="grid">' + list.map(card).join("") + "</div>"
        : '<p class="empty">' + (state.filter === "favs" ? "Noch keine Favoriten. Tippe in einem Look auf ♡ Merken." : "Kein Look passt zu deiner Suche.") + "</p>");

    const q = document.getElementById("q");
    q.addEventListener("input", () => { state.query = q.value; const pos = q.selectionStart; renderHome(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
    app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { state.filter = b.dataset.f; renderHome(); }));
    app.querySelectorAll(".card").forEach(b => b.addEventListener("click", () => openLook(b.dataset.id)));
  }

  function card(l) {
    return '<button class="card" data-id="' + l.id + '">' + swatches(l.colors) +
      '<div class="card-body"><span class="eyebrow">' + esc(l.person) + (favs.includes(l.id) ? ' <span class="fav-dot">♥</span>' : "") + "</span>" +
      "<h3>" + esc(l.title) + "</h3>" +
      '<div class="meta"><span class="pill">' + l.minutes + " Min.</span>" +
      '<span class="pill">' + LEVEL[l.level] + "</span>" +
      '<span class="pill">' + l.products.length + " Produkte</span></div></div></button>";
  }

  // ---- Detailseite ----
  function openLook(id) {
    const l = LOOKS.find(x => x.id === id);
    if (!l) { state.look = null; renderHome(); return; }
    state.look = l; state.tab = "produkte"; state.step = 0;
    if (location.hash !== "#" + id) { try { history.pushState(null, "", "#" + id); } catch (e) {} }
    renderLook(); window.scrollTo(0, 0);
  }

  function renderLook() {
    const l = state.look;
    const fav = favs.includes(l.id);
    app.innerHTML =
      '<button class="back" id="back">← Alle Looks</button>' +
      '<section class="hero"><div style="display:flex;flex-direction:column;gap:10px;min-width:0">' +
      '<span class="eyebrow">' + (l.kind === "celebrity" ? "Star" : "Influencer") + " · " + l.minutes + " Min. · " + LEVEL[l.level] + "</span>" +
      "<h2>" + esc(l.title) + '</h2><span class="who">' + esc(l.person) + "</span>" +
      "<p>" + esc(l.intro) + "</p>" +
      '<div class="hero-actions"><button class="btn primary" id="start">Tutorial starten</button>' +
      '<button class="btn" id="fav" aria-pressed="' + fav + '">' + (fav ? "♥ Gemerkt" : "♡ Merken") + "</button></div></div>" +
      swatches(l.colors) + "</section>" +
      '<div class="tabs" role="tablist">' +
      [["produkte", "Produkte"], ["anleitung", "Anleitung"], ["videos", "Videos"]].map(([k, t]) =>
        '<button class="tab" role="tab" data-t="' + k + '" aria-selected="' + (state.tab === k) + '">' + t + "</button>").join("") +
      '</div><div id="panel"></div>' +
      '<p class="disclaimer">Preise sind ungefähre Richtwerte. Shop-Links öffnen eine Suche nach dem genauen Produkt, damit sie auch funktionieren, wenn sich Produktseiten ändern. „Ähnlicher Effekt“ heißt: Es ist nicht belegt, dass die Person genau dieses Produkt nutzt, es erzeugt aber denselben Look.</p>';

    document.getElementById("back").addEventListener("click", goHome);
    document.getElementById("start").addEventListener("click", () => { state.tab = "anleitung"; state.step = 0; renderLook(); document.querySelector(".tabs").scrollIntoView({ behavior: "smooth" }); });
    document.getElementById("fav").addEventListener("click", () => {
      favs = fav ? favs.filter(x => x !== l.id) : favs.concat(l.id); store.set("lb-favs", favs); renderLook();
    });
    app.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.t; renderLook(); }));
    renderPanel();
  }

  function renderPanel() {
    const l = state.look, panel = document.getElementById("panel");
    if (state.tab === "produkte") panel.innerHTML = productsPanel(l);
    else if (state.tab === "anleitung") panel.innerHTML = stepsPanel(l);
    else panel.innerHTML = videosPanel(l);

    panel.querySelectorAll("input[data-k]").forEach(cb => cb.addEventListener("change", () => {
      if (cb.checked) owned[cb.dataset.k] = true; else delete owned[cb.dataset.k];
      store.set("lb-owned", owned); renderPanel();
    }));
    const prev = panel.querySelector("#prev"), next = panel.querySelector("#next");
    if (prev) prev.addEventListener("click", () => { state.step = Math.max(0, state.step - 1); renderPanel(); });
    if (next) next.addEventListener("click", () => { state.step = state.step + 1; renderPanel(); });
    panel.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => { state.step = +b.dataset.step; renderPanel(); }));
    const again = panel.querySelector("#again");
    if (again) again.addEventListener("click", () => { state.step = 0; renderPanel(); });
  }

  function productsPanel(l) {
    const missing = l.products.filter(p => !owned[pkey(p)]);
    const sum = missing.reduce((a, p) => a + (p.price || 0), 0);
    return '<div class="summary"><span>' + (missing.length
        ? "Dir fehlen noch <strong>" + missing.length + " von " + l.products.length + "</strong> Produkten"
        : "<strong>Du hast alles!</strong> Los geht's mit dem Tutorial.") + "</span>" +
      (missing.length ? "<span>ca. <strong>" + sum + " €</strong></span>" : "") + "</div>" +
      '<ul class="plist">' + l.products.map(p => {
        const k = pkey(p), have = !!owned[k];
        return '<li class="prod' + (have ? " have" : "") + '"><input type="checkbox" id="own-' + esc(k).replace(/[^a-z0-9]/gi, "") + '" data-k="' + esc(k) + '"' + (have ? " checked" : "") + ' aria-label="Hab ich schon: ' + esc(fullName(p)) + '">' +
          '<div class="prod-main"><span class="eyebrow">' + esc(p.cat) + "</span>" +
          '<div class="prod-top"><span class="prod-name">' + esc(p.name) + '</span><span class="brand">' + esc(p.brand) + "</span></div>" +
          '<div class="prod-top">' + (p.shade ? '<span class="shade">Farbe: ' + esc(p.shade) + "</span>" : "") +
          (p.price ? '<span class="price">ca. ' + p.price + " €</span>" : "") +
          '<span class="src ' + p.source + '">' + SRC[p.source] + "</span></div>" +
          (p.note ? '<span class="note">' + esc(p.note) + "</span>" : "") +
          '<div class="links">' + shopLinks(p).map(([t, u]) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + " ↗</a>").join("") + "</div>" +
          "</div></li>";
      }).join("") + "</ul>" +
      '<div class="legend">Woher wir das wissen: ' + Object.keys(SRC).map(k => '<span class="src ' + k + '">' + SRC[k] + "</span>").join("") + "</div>";
  }

  function stepsPanel(l) {
    const n = l.steps.length;
    if (state.step >= n) {
      return '<div class="stepper done"><h3>Fertig! ✨</h3><p style="margin:0 auto">Dein ' + esc(l.title) + "-Look ist komplett.</p>" +
        '<div class="step-nav" style="justify-content:center"><button class="btn" id="again">Nochmal von vorn</button>' +
        '<a class="btn primary" href="' + yt(l.videos[0].q) + '" target="_blank" rel="noopener">Video ansehen ↗</a></div></div>';
    }
    const s = l.steps[state.step];
    const used = (s.uses || []).map(i => l.products[i]).filter(Boolean);
    return '<div class="stepper"><div class="progress"><span style="width:' + Math.round(((state.step + 1) / n) * 100) + '%"></span></div>' +
      '<span class="step-count">Schritt ' + (state.step + 1) + " von " + n + "</span>" +
      "<h3>" + esc(s.title) + "</h3><p>" + esc(s.text) + "</p>" +
      (used.length ? '<div class="uses"><span class="eyebrow">Das brauchst du</span>' + used.map(p =>
        '<div class="use-row"><span><strong>' + esc(p.name) + "</strong> <span class=\"brand\">" + esc(p.brand) + (p.shade ? " · " + esc(p.shade) : "") + "</span></span>" +
        '<a href="' + shopLinks(p)[0][1] + '" target="_blank" rel="noopener">Kaufen ↗</a></div>').join("") + "</div>" : "") +
      '<div class="step-nav"><button class="btn" id="prev"' + (state.step === 0 ? " disabled" : "") + ">← Zurück</button>" +
      '<button class="btn primary" id="next">' + (state.step === n - 1 ? "Fertig ✓" : "Weiter →") + "</button></div></div>" +
      '<ol class="alllist">' + l.steps.map((x, i) => '<li class="' + (i === state.step ? "current" : "") + '"><button data-step="' + i + '">' + esc(x.title) + "</button></li>").join("") + "</ol>";
  }

  function videosPanel(l) {
    const items = l.videos.map(v => ({ title: v.title, sub: "YouTube", url: yt(v.q) }))
      .concat([{ title: l.person + " Make-up auf TikTok", sub: "TikTok", url: tt(l.person + " makeup tutorial") }]);
    return '<div class="vlist">' + items.map(v =>
      '<a class="video" href="' + v.url + '" target="_blank" rel="noopener"><span class="play" aria-hidden="true">▶</span>' +
      "<span><strong>" + esc(v.title) + "</strong><small>" + v.sub + " · öffnet in neuem Tab</small></span></a>").join("") + "</div>";
  }

  function goHome() {
    state.look = null;
    if (location.hash) { try { history.pushState(null, "", location.pathname + location.search); } catch (e) {} }
    renderHome();
  }

  function route() {
    const id = location.hash.slice(1);
    if (id && LOOKS.some(l => l.id === id)) { if (!state.look || state.look.id !== id) openLook(id); }
    else { state.look = null; renderHome(); }
  }
  window.addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
