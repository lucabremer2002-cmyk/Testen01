<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gipfelsprint - Prototyp</title>
<link rel="stylesheet" href="style.css">
<style>
/* Nur was der Prototyp zusaetzlich braucht. Die Anzeige besteht aus drei
   Dingen: Uhr, Tempo, Dash-Vorrat. Alles andere lenkt ab. */
.proto-hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--mono, monospace); }
.proto-top { position: absolute; top: 16px; left: 18px; }
.proto-time { font-size: clamp(30px, 6vw, 54px); font-weight: 700; letter-spacing: -.02em;
  color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.proto-best { font-size: 13px; opacity: .7; color: #fff; letter-spacing: .08em; }

/* Tempo steht mittig unten und ist absichtlich die groesste Zahl nach der
   Uhr: es ist die Waehrung des Spiels. */
.proto-speed { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); text-align: center; }
.proto-speed__v { font-size: clamp(34px, 7vw, 62px); font-weight: 800; line-height: 1;
  color: #cfe4ff; text-shadow: 0 2px 12px rgba(0,0,0,.55); font-variant-numeric: tabular-nums;
  transition: color .12s; }
.proto-speed__v.warm { color: #ffd257; }
.proto-speed__v.hot { color: #ff5fa2; text-shadow: 0 0 22px rgba(255,95,162,.6); }
.proto-speed__u { font-size: 12px; letter-spacing: .22em; opacity: .65; color: #fff; }
.proto-speed__bar { width: min(340px, 52vw); height: 5px; margin: 7px auto 0;
  background: rgba(255,255,255,.16); border-radius: 3px; overflow: hidden; }
.proto-speed__bar i { display: block; height: 100%; background: linear-gradient(90deg, #6ec6ff, #ffd257 55%, #ff5fa2);
  border-radius: 3px; transition: width .06s linear; }

/* Dash-Vorrat: drei Punkte. Sie sind der Grund, Kristalle einzusammeln. */
.proto-dash { position: absolute; right: 20px; bottom: 30px; display: flex; gap: 8px; }
.proto-dash i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.14);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.28); }
.proto-dash i.on { background: #ffd257; box-shadow: 0 0 16px rgba(255,210,87,.75); }

.proto-slide { position: absolute; right: 20px; bottom: 60px; font-size: 12px; letter-spacing: .2em;
  color: #fff; opacity: .28; }
.proto-slide.on { opacity: 1; color: #ff5fa2; text-shadow: 0 0 14px rgba(255,95,162,.7); }

.proto-help { position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  font-size: 12px; letter-spacing: .1em; color: #fff; opacity: .55; text-align: center; line-height: 1.7; }

.proto-res { position: fixed; inset: 0; display: grid; place-items: center; z-index: 12;
  background: radial-gradient(ellipse at 50% 35%, rgba(24,62,98,.86), rgba(6,16,28,.96)); }
.proto-res[hidden] { display: none; }
.proto-res__box { text-align: center; color: #fff; font-family: var(--mono, monospace); padding: 20px; }
.proto-res__t { font-size: clamp(40px, 9vw, 78px); font-weight: 800; font-variant-numeric: tabular-nums; }
.proto-res__new { color: #0d1b2e; background: linear-gradient(90deg, #ffe7a2, #ffd257);
  border-radius: 999px; padding: 5px 16px; font-weight: 800; display: inline-block; margin-bottom: 8px; }
.proto-res__rows { display: grid; gap: 5px; max-width: 360px; margin: 14px auto; }
.proto-res__rows > div { display: flex; justify-content: space-between; padding: 6px 13px;
  border-radius: 10px; background: rgba(255,255,255,.08); font-size: 13px; }
.proto-res__rows span { opacity: .65; }

/* Der Hinweis erscheint genau dann, wenn er gebraucht wird: im Fall, und
   nur solange die Rutschlandung noch nie gesessen hat. */
.proto-teach { position: absolute; left: 50%; top: 42%; transform: translateX(-50%) scale(.9);
  font-size: clamp(17px, 3.2vw, 27px); letter-spacing: .06em; color: #fff; text-align: center;
  background: rgba(255,95,162,.9); padding: 10px 22px; border-radius: 999px;
  opacity: 0; transition: opacity .1s, transform .1s; white-space: nowrap;
  box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.proto-teach.show { opacity: 1; transform: translateX(-50%) scale(1); }
.proto-teach b { font-weight: 900; }
.proto-help { transition: opacity .5s; }
.proto-help.faded { opacity: .12; }

/* Die Toranzeige stammt aus dem grossen Spiel und war dort bildschirmfuellend.
   Hier soll sie den Blick auf die Strecke nicht nehmen - man faehrt gerade
   mit 200 km/h auf die naechste Entscheidung zu. */
.bigmsg { font-size: clamp(18px, 3.4vw, 34px) !important; top: 16% !important; opacity: .9; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="proto-hud">
  <div class="proto-top">
    <div id="protoTime" class="proto-time">00:00.00</div>
    <div id="protoBest" class="proto-best">PB --:--.--</div>
  </div>

  <div id="protoHelp" class="proto-help">
    WASD laufen &nbsp;&middot;&nbsp; LEERTASTE springen (zweimal) &nbsp;&middot;&nbsp; SHIFT halten = rutschen<br>
    Rutschend landen macht Fallhoehe zu Tempo &nbsp;&middot;&nbsp; STRG dash &nbsp;&middot;&nbsp; R neu
  </div>

  <div id="protoMsg" class="bigmsg"></div>
  <div id="protoTeach" class="proto-teach"><b>SHIFT</b> halten beim Aufkommen</div>

  <div class="proto-speed">
    <div id="protoSpeed" class="proto-speed__v">0</div>
    <div class="proto-speed__u">KM/H</div>
    <div class="proto-speed__bar"><i id="protoSpeedBar"></i></div>
  </div>

  <div id="protoSlide" class="proto-slide">RUTSCHEN</div>
  <div id="protoDash" class="proto-dash"></div>

  <div id="protoFlash" class="flash"></div>
</div>

<div id="protoResult" class="proto-res" hidden>
  <div class="proto-res__box">
    <div id="protoResultNew" class="proto-res__new" hidden>NEUE BESTZEIT</div>
    <div id="protoResultTime" class="proto-res__t">00:00.00</div>
    <div class="proto-best">PB <span id="protoResultBest">--:--.--</span></div>
    <div id="protoResultRows" class="proto-res__rows"></div>
    <button id="protoRetry" class="btn btn--big">Nochmal <small>R</small></button>
  </div>
</div>

<div id="protoLoading" class="screen screen--load"><div class="screen__inner"><div class="spinner"></div><p>Prototyp wird gebaut ...</p></div></div>
<div id="protoFatal" class="screen screen--fatal" hidden><div class="screen__inner"><h2>WebGL2 wird benoetigt</h2><p id="protoFatalMsg"></p></div></div>

<script src="src/math.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/physics.js"></script>
<script src="src/level.js"></script>
<script src="src/player.js"></script>
<script src="src/proto/track.js"></script>
<script src="src/proto/proto.js"></script>
</body>
</html>
